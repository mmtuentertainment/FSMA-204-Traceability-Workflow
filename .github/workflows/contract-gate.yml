name: Contract Gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Verify contract and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check OpenAPI contract
        run: npm run api:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check MockRecall contract smoke
        run: npm run test:mock-recall:contract

      - name: Check exception-review PATCH focused test
        run: npm run test:exception-review:patch

      - name: Run fallow CI audit
        run: |
          if ! npx --no-install fallow --version >/dev/null 2>&1; then
            echo "::error::fallow is not installed (expected via npm ci) - failing closed"
            exit 1
          fi
          code=0
          npm run fallow:ci -- --base origin/main || code=$?
          if [ "$code" -eq 1 ]; then
            echo "::warning::fallow audit found issues (exit 1) - not failing the job"
          elif [ "$code" -ne 0 ]; then
            echo "::error::fallow audit failed (exit $code)"
            exit 1
          fi
